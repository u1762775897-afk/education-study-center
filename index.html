,"topic":"第八章·课程","question":"读完诗歌后，自选印象最深的三句并说明理由，属于哪类目标？","answer":"表现性目标","analysis":"允许学生自主选择和表达个人理解，结果开放、不要求统一答案。","wrong":"生成性＝教学过程中逐渐形成目标；行为性＝可观察、可测量；情感性＝态度与体验。","origin":"第八章课程错题·2026-10-18","isPersonal":true,"raw":"05 读完诗歌后，自选印象最深的三句并说明理由，属于哪类目标？\n\n   答案｜表现性目标\n\n   理解｜允许学生自主选择和表达个人理解，结果开放、不要求统一答案。\n\n   易错｜生成性＝教学过程中逐渐形成目标；行为性＝可观察、可测量；情感性＝态度与体验。","warning":""},{"id":"ch8-06","chapter":"课程","topic":"第八章·课程","question":"“课程目标是教学目标的载体和具体化”判断正误。","answer":"错误","analysis":"教学目标是课程目标在具体课堂中的落实和具体化，不能颠倒方向。","wrong":"教育目的→培养目标→课程目标→教学目标。","origin":"第八章课程错题·2026-10-18","isPersonal":true,"raw":"06 “课程目标是教学目标的载体和具体化”判断正误。\n\n   答案｜错误\n\n   理解｜教学目标是课程目标在具体课堂中的落实和具体化，不能颠倒方向。\n\n   易错｜教育目的→培养目标→课程目标→教学目标。","warning":""},{"id":"ch8-07","chapter":"课程","topic":"第八章·课程","question":"“课程目标是培养目标的分解”判断正误。","answer":"正确","analysis":"培养目标较宏观，课程目标将其进一步落实到课程层面。","wrong":"勿与上一题“教学目标是课程目标的具体化”混淆。","origin":"第八章课程错题·2026-10-18","isPersonal":true,"raw":"07 “课程目标是培养目标的分解”判断正误。\n\n   答案｜正确\n\n   理解｜培养目标较宏观，课程目标将其进一步落实到课程层面。\n\n   易错｜勿与上一题“教学目标是课程目标的具体化”混淆。\n\n\n\n\n教育学第八章 · 课程｜独立错题本                              2","warning":""},{"id":"ch8-08","chapter":"课程","topic":"第八章·课程","question":"三维课程目标中，哪一维度是提高学生语文素养的基础？","answer":"知识与技能","analysis":"三维目标：知识与技能、过程与方法、情感态度与价值观；知识技能是重要基础。","wrong":"不能因此忽视过程方法和情感态度。","origin":"第八章课程错题·2026-10-18","isPersonal":true,"raw":"08 三维课程目标中，哪一维度是提高学生语文素养的基础？\n\n   答案｜知识与技能\n\n   理解｜三维目标：知识与技能、过程与方法、情感态度与价值观；知识技能是重要基础。\n\n   易错｜不能因此忽视过程方法和情感态度。","warning":""},{"id":"ch8-09","chapter":"课程","topic":"第八章·课程","question":"“课程目标为教材编写依据，教材是课程目标最主要载体”为什么整句不能选？","answer":"前半句可成立；后半句“最主要”表述过于绝对","analysis":"教材是课程目标的重要载体，目标还需通过教学活动、课程实施与评价落实。","wrong":"遇到“唯一、必然、最主要”等绝对词需结合教材原文审查。","origin":"第八章课程错题·2026-10-18","isPersonal":true,"raw":"09 “课程目标为教材编写依据，教材是课程目标最主要载体”为什么整句不能选？\n\n   答案｜前半句可成立；后半句“最主要”表述过于绝对\n\n   理解｜教材是课程目标的重要载体，目标还需通过教学活动、课程实施与评价落实。\n\n   易错｜遇到“唯一、必然、最主要”等绝对词需结合教材原文审查。\n\n   注意｜口径提醒：不同教材对“主要载体”表述可能不同，按原题完整选项核对。","warning":""},{"id":"ch8-10","chapter":"课程","topic":"第八章·课程","question":"泰勒目标评价模式侧重何种评价？为何不选绝对性评价？","answer":"题库侧重：总结性评价","analysis":"目标评价通过预定目标检验结果，常用于结束阶段判断达成程度。","wrong":"总结性按评价时机/功能划分；绝对性按评价参照标准划分，两者并非互斥。","origin":"第八章课程错题·2026-10-18","isPersonal":true,"raw":"10 泰勒目标评价模式侧重何种评价？为何不选绝对性评价？\n\n   答案｜题库侧重：总结性评价\n\n   理解｜目标评价通过预定目标检验结果，常用于结束阶段判断达成程度。\n\n   易错｜总结性按评价时机/功能划分；绝对性按评价参照标准划分，两者并非互斥。\n\n   注意｜辨析：目标评价也可采用绝对标准，不应记成“绝对性评价错误”。\n\n\n\n\n三、课程类型与组织","warning":""},{"id":"ch8-11","chapter":"课程","topic":"第八章·课程","question":"既是学校教育和科学知识分化的产物，至今课程设置仍以之为主流，是什么课程？","answer":"学科课程","analysis":"按知识领域分科，系统组织和传授学科知识。","wrong":"经验/活动课程侧重儿童经验与活动；综合课程强调跨学科联系。","origin":"第八章课程错题·2026-10-18","isPersonal":true,"raw":"11 既是学校教育和科学知识分化的产物，至今课程设置仍以之为主流，是什么课程？\n\n   答案｜学科课程\n\n   理解｜按知识领域分科，系统组织和传授学科知识。\n\n   易错｜经验/活动课程侧重儿童经验与活动；综合课程强调跨学科联系。\n\n\n\n教育学第八章 · 课程｜独立错题本                            3","warning":""},{"id":"ch8-12","chapter":"课程","topic":"第八章·课程","question":"夸美纽斯泛智课程、斯宾塞功利主义课程，在题库中归为何种课程？","answer":"学科课程","analysis":"泛智强调广泛、系统地传授知识；斯宾塞强调科学知识对完满生活的实用价值。","wrong":"“泛智”不等于“综合课程”；“实用”不等于“活动课程”。","origin":"第八章课程错题·2026-10-18","isPersonal":true,"raw":"12 夸美纽斯泛智课程、斯宾塞功利主义课程，在题库中归为何种课程？\n\n   答案｜学科课程\n\n   理解｜泛智强调广泛、系统地传授知识；斯宾塞强调科学知识对完满生活的实用价值。\n\n   易错｜“泛智”不等于“综合课程”；“实用”不等于“活动课程”。","warning":""},{"id":"ch8-13","chapter":"课程","topic":"第八章·课程","question":"“功利主义”在斯宾塞课程思想中是什么意思？","answer":"重知识的实际生活价值","analysis":"斯宾塞提出“什么知识最有价值”，强调科学知识及其对生活的作用。","wrong":"价值取向重实用，不等于必须采取活动课程组织。","origin":"第八章课程错题·2026-10-18","isPersonal":true,"raw":"13 “功利主义”在斯宾塞课程思想中是什么意思？\n\n   答案｜重知识的实际生活价值\n\n   理解｜斯宾塞提出“什么知识最有价值”，强调科学知识及其对生活的作用。\n\n   易错｜价值取向重实用，不等于必须采取活动课程组织。","warning":""},{"id":"ch8-14","chapter":"课程","topic":"第八章·课程","question":"按课程组织方式划分为显性与隐性，为什么错？","answer":"组织方式：分科课程／综合课程","analysis":"显性与隐性通常按课程呈现方式或显隐程度划分。","wrong":"管理主体：国家／地方／校本；不要混用分类依据。","origin":"第八章课程错题·2026-10-18","isPersonal":true,"raw":"14 按课程组织方式划分为显性与隐性，为什么错？\n\n   答案｜组织方式：分科课程／综合课程\n\n   理解｜显性与隐性通常按课程呈现方式或显隐程度划分。\n\n   易错｜管理主体：国家／地方／校本；不要混用分类依据。","warning":""},{"id":"ch8-15 h+='<div class="pillbar">'+[["S","S 优先精背"],["A","A 重点"],["B","B 基础"],["C","C 拓展"],["all","全部"]].map(function(pair){return '<button data-grade="'+pair[0]+'" class="'+(grade===pair[0]?"on":"")+'">'+pair[1]+'</button>'}).join("")+'</div>';
let subset=KNOWLEDGE.filter(function(k){return (grade==="all"||k.examPriority===grade)&&(!query||[k.title,k.section,k.chapter,k.body,k.confusion].join(" ").toLowerCase().includes(query.toLowerCase()))});

function groupBySection(items){let g={};items.forEach(function(k){(g[k.section]||(g[k.section]=[])).push(k)});return g}
function markButtons(id){let a=status(id);return '<div class="actions"><button data-mark="'+esc(id)+'" data-state="done" class="action '+(a==="done"?"done":"")+'">✓ 已掌握</button><button data-mark="'+esc(id)+'" data-state="wrong" class="action '+(a==="wrong"?"again":"")+'">↻ 需要重背</button></div>'}
function levelTag(k){return '<span class="tag '+esc(k.examPriority||k.level)+'">'+esc(PRIORITY_NAMES[k.examPriority||k.level]||"重点掌握")+'</span>'}
function examAngle(k){let section=k.section||"",title=k.title||"";if(/原则|方法|规律|特点|过程|德育/.test(section+title))return "情境判断／原则方法辨析／主观题简答";if(/人物|思想|理论|模式|学制|起源|主义/.test(section+title))return "人物与理论匹配／关键词选择／易混辨析";if(/评价|课程|心理|学习|权利|法规/.test(section+title))return "概念分类／材料判断／情境应用";return "概念识记／易混辨析／情境分析"}
function info(k){return '<div class="exam-angle revealed-body"><b>常见考法：</b>'+esc(examAngle(k))+' <span class="muter">（备考预测，不代表已统计命题次数）</span></div><div class="read revealed-body"><b>考试表述：</b>'+esc(k.body)+'</div><div class="contrast revealed-body"><b>易混辨析：</b>'+esc(k.confusion)+'</div><div class="memory revealed-body"><b>记忆线索：</b>'+esc(k.memory)+'</div>'}
function renderMap(){
let items=allKnowledge(),group=groupBySection(items);
let h='<div class="help"><b>导图阅读顺序：</b>章 → 知识模块 → 具体考点 → 考试表述 → 易混辨析。每个分支可单独展开；与个人错题完全分开。</div>';
h+='<div class="pillbar"><button data-grade="all" class="'+(grade==="all"?"on":"")+'">全部考点</button><button data-grade="S" class="'+(grade==="S"?"on":"")+'">S 优先精背</button><button data-grade="A" class="'+(grade==="A"?"on":"")+'">A 重点</button><button data-grade="B" class="'+(grade==="B"?"on":"")+'">B 基础</button><button data-grade="C" class="'+(grade==="C"?"on":"")+'">C 拓展</button></div>';
let idx=0;for(const [section,arr] of Object.entries(group)){h+='<details class="section-tree" '+(idx++===0?"open":"")+'><summary>'+esc(chosen)+' ／ '+esc(section)+' <span class="muter">· '+arr.length+'个考点</span></summary><div class="tree-items">';for(const k of arr){h+='<details class="tree-node" open><summary>'+levelTag(k)+' '+esc(k.title)+'</summary>'+info(k)+'</details>'}h+='</div></details>'}
document.getElementById("content").innerHTML=h+(items.length?"":'<div class="empty">此筛选条件下没有知识点。切换“全部考点”即可查看。</div>');
}
function renderMemo(){
let items=allKnowledge();let total=KNOWLEDGE.filter(function(k){return k.chapter===chosen}).length,done=KNOWLEDGE.filter(function(k){return k.chapter===chosen&&status(noteId(k))==="done"}).length;
let h='<div class="help"><b>精准背诵：</b>先读标题独立回忆，展开“查看标准背诵内容”后核对完整表述、易混辨析、记忆线索。错题只在独立错题本出现。</div><div class="block"><strong>本章背诵进度 '+done+'/'+total+'</strong><div class="progress"><div class="bar" style="width:'+(total?Math.round(done/total*100):0)+'%"></div></div></div><div class="pillbar"><button data-grade="all" class="'+(grade==="all"?"on":"")+'">全部考点</button><button data-grade="A" class="'+(grade==="A"?"on":"")+'">核心必背</button><button data-grade="B" class="'+(grade==="B"?"on":"")+'">重要考点</button><button data-grade="C" class="'+(grade==="C"?"on":"")+'">拓展了解</button></div>';
for(const k of items){h+='<article class="block"><div class="topline">'+levelTag(k)+'<span class="muted">'+esc(k.section)+'</span></div><h3>'+esc(k.title)+'</h3><details '+(hiddenAnswers?"":"open")+'><summary class="answer-summary">点击查看／收起标准背诵内容</summary><div class="answer-details">'+info(k)+'</div></details>'+markButtons(noteId(k))+'</article>';}
document.getElementById("content").innerHTML=h+(items.length?"":'<div class="empty">没有匹配考点。</div>');
}
function qCard(q,quiz){let h='<article class="block"><div class="topline"><span class="tag">'+esc(q.origin)+'</span><span class="muted">'+esc(q.chapter)+'</span></div><div class="q">'+esc(q.question)+'</div><details '+(quiz?"":"")+'><summary class="answer-summary">'+(quiz?"我已思考，展开正确答案":"展开原始答案与解析")+'</summary>';
h+='<div class="qanswer"><b>正确答案：</b>'+esc(q.answer||"原始记录未能可靠提取，请核对原题。")+'</div>';if(q.analysis)h+='<div class="read"><b>理解：</b>'+esc(q.analysis)+'</div>';if(q.wrong)h+='<div class="contrast"><b>易错／旧错选：</b>'+esc(q.wrong)+'</div>';if(q.warning)h+='<div class="qwarn">核对提醒：'+esc(q.warning)+'</div>';if(q.raw)h+='<details><summary class="muter">展开原始PDF提取内容</summary><div class="raw">'+esc(q.raw)+'</div></details>';h+='</details>';
h+=markButtons(q.id);if(String(q.id).startsWith("mine-"))h+='<button class="tiny" data-delete="'+esc(q.id)+'">删除这条自录错题</button>';h+='</article>';return h}
function renderMistakes(quiz){let list=allMistakes();let h='<div class="help"><b>'+(quiz?"错题抽测":"独立个人错题本")+'：</b>此前的课程41道、第六七章16道、教育学57条以及德育旧错题分开保留。原始记录不完整的题目显示核对提醒。每天新增的错题只保存在本设备，可导出备份。</div>';

h+='<div class="block"><strong>'+list.length+'道题</strong><span class="muted"> · '+(mistakeScope==="chapter"?"当前专题":"跨专题总览")+' · '+(quiz?"默认隐藏答案":"点击题目查看答案")+'</span></div>';
h+=list.map(function(q){return qCard(q,quiz)}).join("");document.getElementById("content").innerHTML=h+(list.length?"":'<div class="empty">当前范围没有已保存的错题，点“全部章节”或添加新的错题。</div>');
}
function download(){let payload={created:new Date().toISOString(),study:state,old:legacy};let blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download="教育学学习进度与自录错题备份.json";a.click();setTimeout(function(){URL.revokeObjectURL(url)},3000)}
document.addEventListener("click",function(ev){let b=ev.target.closest("button");if(!b)return;if(b.dataset.goMemo){chosen=b.dataset.goMemo;tab="memo";grade=b.dataset.goGrade||"all";query="";render();document.getElementById("content").scrollIntoView({block:"start"});return}if(b.dataset.ch){changeChapter(b.dataset.ch);return}if(b.dataset.tab){changeTab(b.dataset.tab);return}if(b.dataset.grade){grade=b.dataset.grade;render();return}if(b.dataset.mark){setMark(b.dataset.mark,b.dataset.state);return}if(b.dataset.delete){if(confirm("删除这条自录错题？")){state.custom=state.custom.filter(function(q){return q.id!==b.dataset.delete});persist();render()}return}if(b.id==="all-chapters-radar"){query="";grade="all";render();return}if(b.id==="expand"){document.querySelectorAll(".section-tree,.tree-node").forEach(function(d){d.open=true});return}if(b.id==="collapse"){document.querySelectorAll(".section-tree,.tree-node").forEach(function(d){d.open=false});return}if(b.id==="hide-answers"){hiddenAnswers=!hiddenAnswers;render();return}if(b.id==="only-wrong"){wrongOnly=!wrongOnly;render();return}if(b.id==="scope"){mistakeScope=mistakeScope==="chapter"?"all":"chapter";render();return}if(b.id==="add-mistake"){showAddForm=!showAddForm;render();return}if(b.id==="cancel-add"){showAddForm=false;render();return}if(b.id==="backup"){download();return}});
document.addEventListener("input",function(e){if(e.target.id!=="search")return;let pos=e.target.selectionStart;query=e.target.value;let focusId="search";render();let el=document.getElementById(focusId);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(err){}}});
document.addEventListener("submit",function(e){if(e.target.id!=="new-mistake")return;e.preventDefault();let f=e.target;let q=f.elements.question.value.trim(),ans=f.elements.answer.value.trim();if(!q||!ans)return;state.custom.unshift({id:"mine-"+Date.now()+"-"+Math.random().toString(36).slice(2,6),chapter:f.elements.chapter.value,question:q,answer:ans,wrong:f.elements.wrong.value.trim(),analysis:f.elements.analysis.value.trim(),origin:"我新增的错题",topic:"手动记录",raw:"",warning:""});persist();showAddForm=false;mistakeScope="chapter";chosen=f.elements.chapter.value;render()});
