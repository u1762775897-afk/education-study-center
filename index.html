<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教育学 · 背诵与错题中心</title></head><body><main id="fallback"><h1>教育学 · 背诵与错题中心</h1><p>正在初始化……</p></main><script>window.studyArchive=[{"title":"教育学57条错题笔记","source":"教育学错题笔记_精讲易读版_20261017.pdf","text":"教育学错题             精讲易读版\n2026年10月17日｜57个考点｜按章节归类｜题目—答案—理解提示\n\n\n\n课程\n\n题目 / 考点                       正确答案                  为什么 / 易错提醒\n\n\n 01. 国家课程的典型特征？               统一性、基础性、强制性           多样性不宜作为国家课程典型特征。\n\n\n 02. 课程目标的体验性目标与表现性目标如何区分？    体验性：经历、感受；表现性：开放表     体验性目标重参与过程与感受；表现性目标允许学生用不同方式展示学习成果，\n                              达、创作                  如自由创编。\n\n\n 03. 课程过程模式思想源头及代表？           源头：卢梭；代表：斯滕豪斯         卢梭的自然教育思想是思想渊源；斯滕豪斯系统提出过程模式，强调实践与过程\n                                                    ，不以预设行为目标为唯一标准。\n\n\n 04. 课程目标与教材是什么关系？            课程目标指方向；教材是重要载体       教材编写的直接依据通常为课程标准。\n\n\n 05. 目标模式属于什么取向？              科学取向；泰勒               重目标、可测量与评价。\n\n\n 06. 课程计划编制要协调哪些关系？           基础/提高；分科/综合；显性/隐性；理   四对关系分别处理基础与拓展、学科分化与联系、正式课程与潜在影响、知识与\n                              论/实践                  实际运用。\n\n\n 07. 泰勒课程内容组织三原则？             连续性、顺序性、整合性           连续性：关键要素反复出现；顺序性：同一要素逐层加深；整合性：不同学科或\n                                                    内容彼此关联。\n\n\n 08. 布鲁纳课程观核心？                学科基本结构、发现学习、螺旋式课程     重基本概念原理；通过探索发现。\n\n\n 09. 课程资源是否包括教师和学生？           包括；属于人力课程资源           还有教材、场馆、社会环境等。\n\n\n\n教学基本概念\n\n\n                                                                              教育学错题速查   第1页\n\n题目 / 考点                   正确答案                为什么 / 易错提醒\n\n\n10. 学校工作的中心是什么？           教学工作                学校工作必须以教学为中心。\n\n\n11. 教学是什么活动？              教师教与学生学相统一的双边活动     教学不是单独的教师活动或学生活动，而是教师教与学生学相统一、促进学生发\n                                              展的特殊认识活动。\n\n\n\n教学过程\n\n题目 / 考点                   正确答案                为什么 / 易错提醒\n\n\n12. 学生掌握知识的中心阶段？          理解教材                由感知进入理解概念与规律。\n\n\n13. 教学过程主要矛盾的实质？          学生认识过程中的矛盾          依题目要求保留原句。\n\n\n14. 认识论的一般规律？             生动直观→抽象思维→实践        先从具体感知上升到抽象概念，再把认识用于实践；这是一般认识路线，不等于\n                                              教学以间接经验为主的特点。\n\n\n15. 学生主要通过什么认识世界？         以科学文化知识为中介，间接认识世界   属于教学认识的特殊性，不是认识论一般路线。\n\n\n\n教学原则\n\n题目 / 考点                   正确答案                为什么 / 易错提醒\n\n\n16. “道而弗牵，强而弗抑，开而弗达”体现？   启发性原则               引导而不牵制、鼓励而不压制、启发而不直接给结论，核心是学生主动思考。\n\n\n17. “学不躐等”“不陵节而施”体现？      循序渐进原则              按学习顺序与阶段教学。\n\n\n18. “杂施而不孙，则坏乱而不修”体现？     循序渐进原则              杂乱无序教学会妨碍学习。\n\n\n19. “故君子之教喻也”体现？          启发性原则               强调善于启发引导。\n\n\n\n\n                                                                        教育学错题速查    第2页\n\n教学方法\n\n题目 / 考点                    正确答案                为什么 / 易错提醒\n\n\n20. 欣赏法与情境教学法区别？           欣赏法：欣赏感受；情境法：创设情境   作品审美体验 vs 画面声音故事等情境。\n\n\n21. 实际测算、测绘、种植、饲养属于？       实习作业法               测绘、测算、种植、饲养是在真实任务中运用所学；实验法更侧重控制条件、观\n                                               察现象或验证规律。\n\n\n22. 参观教学法按教学进程分为？          准备性、并行性、总结性参观       准备性参观在新课前；并行性在学习中；总结性在学完后。“可行性”说的是能\n                                               否实施，不是这种分类。\n\n\n23. 演示法与实验法区别？             演示：教师展示；实验：学生操作探究   关键看操作主体与探究目的。\n\n\n24. 读书指导法与自学法区别？           读书指导：教师指导阅读；自学：学生   前者重指导阅读，后者重自主安排。\n                           自主学习\n\n\n25. 实物、模像、言语直观如何区分？        实物看真物；模像看模型图像；言语靠   传统直观分类主要是这三类。\n                           描述\n\n\n\n教学模式\n\n题目 / 考点                    正确答案                为什么 / 易错提醒\n\n\n26. 非指导性教学属于哪一理论流派？        情感教学理论流派；罗杰斯        罗杰斯强调学习者中心、自主学习、真诚接纳及减少心理威胁，因重视情感与人\n                                               格发展而归入情感取向。\n\n\n27.                        认知：理解；行为：强化；情感：体验   布鲁纳/奥苏贝尔；斯金纳；罗杰斯；凯洛夫常作对照。\n认知、行为主义、情感、哲学取向教学流派怎么区分？   ；哲学：教学理论系统\n\n\n28. 发展性教学模式代表及主张？          赞科夫；高难度、高速度         促进学生一般发展。\n\n\n\n\n                                                                           教育学错题速查   第3页\n\n29. 教学最优化模式代表及主张？          巴班斯基；优化教学方案            兼顾教学效果、时间和精力。\n\n\n30. 掌握学习模式代表及主张？           布卢姆；足够时间和适当教学          多数学生可以达到掌握标准。\n\n\n31. 范例教学模式代表及主张？           瓦根舍因；典型范例              以点带面理解规律。\n\n\n32. 六课型单元教学、六步教学法、学导式属于？   自学辅导教学模式               自学+辅导；不是引导发现模式。\n\n\n\n教学组织形式\n\n题目 / 考点                    正确答案                   为什么 / 易错提醒\n\n\n33. 教师教一组学生时其他学生自学，交替进行？   复式教学                   一名教师同堂教授不同年级或班级。\n\n\n34. 优秀年长学生教年幼学生是什么制度？      贝尔—兰卡斯特制（导生制）          学生充当导生；非道尔顿制。\n\n\n35. 道尔顿制代表、年代、特点？          帕克赫斯特；20世纪初（1920年前后）   帕克赫斯特在20世纪初推广道尔顿制：教师提出任务，学生依自身进度独立学习\n                                                  ，教师给予个别指导。\n\n\n36. 文纳特卡制代表、特点？            华虚朋；个别学习+集体创造活动        基础知识个别学，创造活动集体做。\n\n\n37. 设计教学法代表及特点？            克伯屈；有目的的实际活动           强调做中学、项目活动。\n\n\n38. 特朗普制的三种组织形式？           大班上课＋小组讨论＋个人自学         特朗普制又称灵活课程表制：大班讲授约40%、小组讨论约20%、个人独立学习\n                                                  约40%，比例为常见教材表述。\n\n\n39. 班级授课制的系统论述者？           夸美纽斯《大教学论》（1632）       夸美纽斯在《大教学论》中系统论述班级授课制；不要误认为始于赫尔巴特。\n\n\n40. 鲁迅在三味书屋的教学组织形式？        个别教学制                  同一场所，分别指导不同学生。\n\n\n41. 协作、开放、个别、复式教学区别？       协作：教师合作；开放：自主灵活；个      按教师协作、学生自主、个别指导和多班轮换区分。\n                           别：分别指导；复式：交替授课\n\n\n\n                                                                              教育学错题速查   第4页\n\n42. 按一节课完成任务数量分为？      单一课、综合课             一种任务 vs 两种及以上任务。\n\n\n\n教学常规\n\n题目 / 考点                正确答案                为什么 / 易错提醒\n\n\n43. 教师教学工作五个基本环节？      备课、上课、作业布置批改、课外辅导   按教学工作流程记忆。\n                       、成绩检查评定\n\n\n44. 备课的三个方面及第一步？       钻研教材、了解学生、设计教法；第一   先钻研教材，再了解学生、设计教法，最后形成教案；编写教案不是备课的第一\n                       步钻研教材               步。\n\n\n45. “三备”是什么？           备教材、备学生、备教法         与备课三方面相对应。\n\n\n\n教学评价\n\n题目 / 考点                正确答案                为什么 / 易错提醒\n\n\n46. 绝对、相对、个体内差异评价区别？   绝对看标准；相对看排名；个体内看自   达标、群体比较、自我前后比较。\n                       身变化\n\n\n47. 诊断、形成、终结评价区别？      诊断：教学前；形成：教学中；终结：   摸底、反馈改进、总结结果。\n                       教学后\n\n\n48. 综合性与选拔性评价区别？       综合：多维全面；选拔：择优筛选     分别强调评价范围和评价目的。\n\n\n49. 定性与定量评价区别？         定性：描述评语；定量：分数统计     重性质与过程 vs 重数字与比较。\n\n\n50. 信度、效度、难度、区分度区别？    信度：稳定；效度：准确；难度：易难   信度看稳定，效度看测准，难度看答对比例，区分度看能否区分不同水平的学生\n                       ；区分度：辨别水平           。\n\n\n\n\n                                                                     教育学错题速查   第5页\n\n51. 内容、表面、结构、经验效度区别？    内容：覆盖目标；表面：看似相关；结   表面效度看表面是否像在测目标；内容效度看考查内容是否覆盖目标；结构效度\n                        构：测到理论特质；经验：与外部效标   看是否测到理论能力；经验效度看与外部实际标准的吻合。\n                        相关\n\n\n52. 难度系数越大题越难？          错误；P越大通常越容易         常用难度系数P是答对率：P=0.9意味着容易，P=0.1意味着难。合适难度取决于\n                                            测验目的，不能一律追求0.5。\n\n\n53. 效果指标与效能指标如何区分？      效果重结果；效能兼顾结果与有效程度   按所述题库口径，注意教材定义差异。\n\n\n54. 有效讲授的适当时机有哪些？       学生定向、出现误读、理解困难时     组织教学主要安排秩序流程，非知识讲授时机。\n\n\n\n教育思想\n\n题目 / 考点                 正确答案                为什么 / 易错提醒\n\n\n55. 洛克、赫尔巴特、杜威、斯宾塞主张？   洛克白板说；赫尔巴特教师中心；杜威   洛克：白板说、经验影响心智；赫尔巴特：教师中心、教育性教学；杜威：儿童\n                        儿童中心；斯宾塞完满生活        中心、从做中学；斯宾塞：教育为完满生活作准备。\n\n\n56. 重古典语言、文法训练理性思维是谁？   洛克（形式教育相关考点）        与斯宾塞重科学实用知识区分；题库人物归属建议核对原题。\n\n\n57. “君子处其实，不居其华”侧重？     重内在品质、人格养成          重实质不重浮华。\n\n\n\n\n                                                                           教育学错题速查     第6页"},{"title":"第八章课程41道错题","source":"教育学第八章_课程错题本_详解版_20261018.pdf","text":"第八章｜课程\n教师招聘教育学 · 独立错题本 · 2026年10月18日\n\n题干与答案 · 简短解释 · 易错对比 · 争议题特别标注\n\n复习方法：先遮住“正确答案”回忆，再看“为什么”和“易错提醒”。标有“口径/争议”的题目以原题、教材和权威出处复核。\n\n\n一、课程实施与组织\n   01 辛德等人：教师依据具体条件和理解，对既定课程调整改造，属于哪种取向？\n\n   答案｜相互适应取向（B）\n\n   理解｜课程方案与教师、学生、情境之间双向调整；既不是原封不动，也不是完全重新创造。\n\n   易错｜忠实＝按原方案执行；创生＝师生在实践中共同生成课程经验；“专家取向”非经典三分法。\n\n\n\n   02 小学测量三角形内角和，中学再证明内角和定理，属于何种组织形式？\n\n   答案｜螺旋式组织\n\n   理解｜同一核心知识反复出现，每次在深度和难度上提升。\n\n   易错｜直线式＝依次推进、不刻意反复；纵向＝按层次递进；横向＝相关内容联系。\n\n\n\n   03 课程实施不包括哪项：编制课程结构／安排课程表／分析教学任务／组织教学活动？\n\n   答案｜编制课程结构\n\n   理解｜编制课程结构主要属课程设计；后三项将既定课程落实到实际教学，属于实施。\n\n   易错｜设计决定“安排什么”，实施决定“怎样落地”。\n\n\n\n\n教育学第八章 · 课程｜独立错题本                                            1\n\n   04 “课程设计得好，实施起来一般越容易，效果越好”判断正误。\n\n   答案｜正确（一般性判断）\n\n   理解｜良好的设计有利于实施，但实施仍受教师、资源、学生和情境影响。\n\n   易错｜“一般更容易”不等于“设计好就必然成功”。\n\n\n\n\n二、课程目标与评价\n   05 读完诗歌后，自选印象最深的三句并说明理由，属于哪类目标？\n\n   答案｜表现性目标\n\n   理解｜允许学生自主选择和表达个人理解，结果开放、不要求统一答案。\n\n   易错｜生成性＝教学过程中逐渐形成目标；行为性＝可观察、可测量；情感性＝态度与体验。\n\n\n\n   06 “课程目标是教学目标的载体和具体化”判断正误。\n\n   答案｜错误\n\n   理解｜教学目标是课程目标在具体课堂中的落实和具体化，不能颠倒方向。\n\n   易错｜教育目的→培养目标→课程目标→教学目标。\n\n\n\n   07 “课程目标是培养目标的分解”判断正误。\n\n   答案｜正确\n\n   理解｜培养目标较宏观，课程目标将其进一步落实到课程层面。\n\n   易错｜勿与上一题“教学目标是课程目标的具体化”混淆。\n\n\n\n\n教育学第八章 · 课程｜独立错题本                              2\n\n   08 三维课程目标中，哪一维度是提高学生语文素养的基础？\n\n   答案｜知识与技能\n\n   理解｜三维目标：知识与技能、过程与方法、情感态度与价值观；知识技能是重要基础。\n\n   易错｜不能因此忽视过程方法和情感态度。\n\n\n\n   09 “课程目标为教材编写依据，教材是课程目标最主要载体”为什么整句不能选？\n\n   答案｜前半句可成立；后半句“最主要”表述过于绝对\n\n   理解｜教材是课程目标的重要载体，目标还需通过教学活动、课程实施与评价落实。\n\n   易错｜遇到“唯一、必然、最主要”等绝对词需结合教材原文审查。\n\n   注意｜口径提醒：不同教材对“主要载体”表述可能不同，按原题完整选项核对。\n\n\n\n   10 泰勒目标评价模式侧重何种评价？为何不选绝对性评价？\n\n   答案｜题库侧重：总结性评价\n\n   理解｜目标评价通过预定目标检验结果，常用于结束阶段判断达成程度。\n\n   易错｜总结性按评价时机/功能划分；绝对性按评价参照标准划分，两者并非互斥。\n\n   注意｜辨析：目标评价也可采用绝对标准，不应记成“绝对性评价错误”。\n\n\n\n\n三、课程类型与组织\n   11 既是学校教育和科学知识分化的产物，至今课程设置仍以之为主流，是什么课程？\n\n   答案｜学科课程\n\n   理解｜按知识领域分科，系统组织和传授学科知识。\n\n   易错｜经验/活动课程侧重儿童经验与活动；综合课程强调跨学科联系。\n\n\n\n教育学第八章 · 课程｜独立错题本                            3\n\n   12 夸美纽斯泛智课程、斯宾塞功利主义课程，在题库中归为何种课程？\n\n   答案｜学科课程\n\n   理解｜泛智强调广泛、系统地传授知识；斯宾塞强调科学知识对完满生活的实用价值。\n\n   易错｜“泛智”不等于“综合课程”；“实用”不等于“活动课程”。\n\n\n\n   13 “功利主义”在斯宾塞课程思想中是什么意思？\n\n   答案｜重知识的实际生活价值\n\n   理解｜斯宾塞提出“什么知识最有价值”，强调科学知识及其对生活的作用。\n\n   易错｜价值取向重实用，不等于必须采取活动课程组织。\n\n\n\n   14 按课程组织方式划分为显性与隐性，为什么错？\n\n   答案｜组织方式：分科课程／综合课程\n\n   理解｜显性与隐性通常按课程呈现方式或显隐程度划分。\n\n   易错｜管理主体：国家／地方／校本；不要混用分类依据。\n\n\n\n   15 既重知识技能，也重思维、判断、动机和态度，属于什么课程？\n\n   答案｜基础性课程\n\n   理解｜为学生知识、能力和态度全面发展奠基。\n\n   易错｜基础性＝打底；拓展性＝拓宽视野、兴趣；研究性＝探究问题。\n\n\n\n\n教育学第八章 · 课程｜独立错题本                           4\n\n   16 注重培养学生探求精神和探究能力，属于什么课程？\n\n   答案｜研究性课程\n\n   理解｜核心是提出问题、搜集证据、研究探索并形成认识。\n\n   易错｜拓展性也可发展能力，但核心在拓宽学习领域；研究性突出“探究”。\n\n\n\n   17 活动课程与综合课程、学科课程如何区分？\n\n   答案｜活动重经验；综合重整合；学科重系统知识\n\n   理解｜音乐例：组织舞台体验活动＝活动；音乐+历史联合专题＝综合；按乐理知识体系授课＝学科。\n\n   易错｜活动、经验常关联杜威；不等于所有实践性内容都是活动课程。\n\n\n\n   18 “学校课程的真正中心是儿童的社会活动”体现什么？\n\n   答案｜儿童中心／活动课程思想（常联系杜威）\n\n   理解｜A重儿童兴趣需要；C、D可作为对其忽视系统知识的批评。\n\n   易错｜题库给ACD、排除“课程单元而非分科”的B，但B本身与活动课程常见组织方式并不冲突。\n\n   注意｜争议题：B不能仅凭这段引文判定为错误，保留题库答案ACD并标注争议。\n\n\n\n\n四、课程理论与人物\n   19 “人类文化共同要素、系统知识传授”对应什么课程理论？\n\n   答案｜要素主义：巴格莱\n\n   理解｜强调基础知识、基本技能和共同文化要素。\n\n   易错｜永恒主义：赫钦斯、阿德勒；强调经典名著和永恒真理。\n\n\n\n\n教育学第八章 · 课程｜独立错题本                                  5\n\n   20 “学校应开设经典名著课程”是要素主义吗？\n\n   答案｜不是；是永恒主义\n\n   理解｜永恒主义重经典著作、理性与永恒真理。\n\n   易错｜要素主义＝巴格莱＝基础知识技能；永恒主义＝赫钦斯、阿德勒＝经典名著。\n\n\n\n   21 “教材是学生自我发展、自我实现的手段，学生是教材主宰”属于什么理论？\n\n   答案｜存在主义课程论\n\n   理解｜重个体自由选择、个性、自我实现。\n\n   易错｜常见代表：奈勒；注意与重人的尊严、潜能的人文主义取向相近但不等同。\n\n\n\n   22 “认知结构不断改进，螺旋上升编制课程”属于什么理论？\n\n   答案｜结构主义：布鲁纳\n\n   理解｜重学科基本结构及螺旋式课程组织。\n\n   易错｜结构主义看知识结构；存在主义看个体选择。\n\n\n\n   23 课程“丰富性、循环性、关联性、严密性”是谁的观点？\n\n   答案｜后现代课程论：多尔\n\n   理解｜强调课程是开放、互动、不断展开的动态过程。\n\n   易错｜多尔4R常见译法为丰富性、回归性、关联性、严密性；“循环性”见部分题库译法。\n\n\n\n\n教育学第八章 · 课程｜独立错题本                              6\n\n   24 朱熹“宽着期限，紧着课程”是什么意思？\n\n   答案｜学习期限留有余地，日常学习进度要抓紧\n\n   理解｜循序渐进又不懈怠；古代“课程”常指学习安排和进程。\n\n   易错｜朱熹：循序渐进、熟读精思；孔子：启发诱导、学思结合。\n\n\n\n   25 孔子、韩愈、朱熹、王夫之有哪些易混名言？\n\n   答案｜孔子：不愤不启；韩愈：传道授业解惑；朱熹：循序渐进；王夫之：知行相资\n\n   理解｜孔子重启发与学思；韩愈重师道；朱熹重读书方法；王夫之重知行相互促进。\n\n   易错｜王夫之亦称王船山；“因材施教”为后人概括孔子思想。\n\n\n\n   26 “世界以外无书籍，事实以外无教材”题库为何选人文主义？\n\n   答案｜题库答案：人文主义课程观\n\n   理解｜题库从尊重儿童直接经验、人的需要与发展解释；活动中心同样强调直接经验，易混。\n\n   易错｜人文主义看人的尊严、潜能与和谐发展；活动中心看儿童活动和经验。\n\n   注意｜争议题：仅凭该引文难以排除活动中心；题库将其归于卢梭人文主义口径，应结合完整出处。\n\n\n\n\n五、课程文件与国家课程\n   27 “课程标准根据教科书编写”为什么错？\n\n   答案｜教科书依据课程标准编写\n\n   理解｜课程计划管整体课程设置；课程标准规定学科要求；教科书呈现具体教学内容。\n\n   易错｜课程计划→课程标准→教科书，注意方向。\n\n\n\n\n教育学第八章 · 课程｜独立错题本                                 7\n\n   28 国家课程目的有哪些？多选漏选了什么？\n\n   答案｜保障学习权利、明确达成标准、保持连续性和连贯性、提供公众了解依据\n\n   理解｜连续性强调逐步发展，连贯性强调学段与内容衔接。\n\n   易错｜不能只选“统一标准、保障权利”，还应关注课程衔接。\n\n\n\n   29 编制课程计划要处理哪些关系？\n\n   答案｜基础与提高、分科与综合、理论与实践\n\n   理解｜三组涉及课程内容与结构的合理安排。\n\n   易错｜题库不含“显性与隐性”；后者属于显隐程度的分类。\n\n   注意｜口径提醒：有的教材也讨论显性/隐性关系；本题以所用题库三组为准。\n\n\n\n   30 小学阶段课程的三个特点是什么？\n\n   答案｜普及性、基础性、发展性\n\n   理解｜面向全体学生，奠定基础并促进持续发展。\n\n   易错｜不选“科学性、普及性、发展性”。\n\n\n\n   31 “为学生各种素质全面和谐发展打好基础”体现义务教育课程计划什么特点？\n\n   答案｜基础性\n\n   理解｜关键词“打好基础”。\n\n   易错｜普遍性＝面向所有适龄学生；义务性＝依法接受；合理性为干扰项。\n\n\n\n\n六、隐性课程\n\n\n教育学第八章 · 课程｜独立错题本                          8\n\n   32 隐性课程概念由谁提出？有什么特征？\n\n   答案｜杰克逊；《班级生活》；潜在性、多样性、不易察觉性\n\n   理解｜学校文化、制度氛围、师生互动等可带来未明示的学习经验。\n\n   易错｜多选别漏“多样性”；时间常记20世纪60年代后期。\n\n\n\n   33 师生关系、办学理念为何属于隐性课程？课外活动为何不必然属于？\n\n   答案｜师生关系与办学理念可产生隐性教育影响\n\n   理解｜隐性课程不要求是一门正式课；课外活动若有明确计划与目标，其活动本身可能是显性安排。\n\n   易错｜课外≠隐性；制度文化可以成为隐性课程来源。\n\n\n\n   34 “隐性课程独立于学校课程建设之外”为什么错？\n\n   答案｜隐性课程并不独立于学校课程建设\n\n   理解｜学校环境、组织文化、教师行为和显性课程实施都会产生隐性影响。\n\n   易错｜隐性课程可积极也可消极，常有非预期性。\n\n\n\n   35 杜威认为“附带学习”可能比直接学习更重要，强调什么？\n\n   答案｜隐性课程的重要性\n\n   理解｜学生在正式知识之外习得合作、态度和价值观等。\n\n   易错｜附带学习≠选修课程；地方课程是另一分类维度。\n\n\n\n\n七、新课程改革\n\n\n\n\n教育学第八章 · 课程｜独立错题本                                 9\n\n   36 新课改“为了每一位学生的发展”包含什么？\n\n   答案｜以人为本、个性发展、全人教育\n\n   理解｜全人教育不仅是知识，还重能力、情感、人格和社会性。\n\n   易错｜“强化基础教育”不属于这三个含义的并列概括。\n\n\n\n   37 从教学大纲到课程标准，价值取向有何变化？\n\n   答案｜A知识→整体素质；B硬性统一→开放灵活；C精英→大众；D学科知识本位→学生发展本位\n\n   理解｜本题为ABCD全选；尤其别漏C、D。\n\n   易错｜D并非错误，用户已更正为四项全选。\n\n\n\n   38 校本课程开发的基本理念有哪些？\n\n   答案｜学生为本、决策分享、全员参与合作\n\n   理解｜决策分享重共同参与决定；全员合作重共同实施。\n\n   易错｜“学习为上的评价观念”非题库所列三项；漏选过决策分享。\n\n\n\n   39 新课改加强德育针对性和实效性体现在哪些方面？\n\n   答案｜加强德育建设、学科渗透德育、综合实践活动必修\n\n   理解｜这些直接指向德育内容、实施渠道与实践育人。\n\n   易错｜“建立新的教学方式”较宽泛，不直接对应本题所列德育举措。\n\n\n\n\n教育学第八章 · 课程｜独立错题本                                 10\n\n   40 教师帮助学生制定学习目标、指导学习策略、营造良好环境，属于管理者吗？\n\n   答案｜不是；属于学习促进者\n\n   理解｜促进者重指导学生学会学习；管理者重秩序、组织和日常管理。\n\n   易错｜不要把“组织学习支持”一概当作管理者。\n\n\n\n   41 三维目标与课程改革强调的学生发展如何联系？\n\n   答案｜知识与技能、过程与方法、情感态度与价值观共同促进发展\n\n   理解｜知识技能是基础，过程方法体现学习方式，情感价值观关注态度和人格。\n\n   易错｜三者是相互联系的整体，而非只抓知识。\n\n\n\n\n教育学第八章 · 课程｜独立错题本                          11"},{"title":"第六七章16道错题","source":"教育学第六七章_合并错题本_20261017.pdf","text":"教育学        第六、七章合并错题本\n独立于《课程》错题本｜2026.10.17｜题目   答案   简明解释   易混提醒\n\n\n\n第六章｜教育制度\n\n 01 广义教育制度包括哪些？教材为何不属于？           教育考试制度、教育领导体制、各级各类学校   制度              成教学任务；自我更新＝主动反思、持续改善。\n\n\n14 共享共创式师生关系处于什么层次？        师生关系的较高／最高层次（依该题教材表述   强调平等合作、共同探索与成长。\n                           ）。\n\n\n15                         社会关系、教育关系、心理关系。        社会关系指向年轻一代成长；教育关系指向学生发展；心理关系\n师生关系的基本类型有哪些？为何不选朋友关系？                            重理解信任。私人友谊不是其基本分类。\n\n\n16 “教师的精神融入学生心灵，学生一举一动有教   示范性、长期性（结合选项判断）。       示范性重言行榜样；长期性重影响持续；复杂性重教育对象和任\n师影子”体现什么劳动特点？                                     务的多样性；创造性重灵活创新。\n\n\n\n\n                                                                             第2页"}];

const css=`*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#243650;font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid #4f80df}.shell{max-width:1280px;margin:auto;padding:0 22px}.top{background:#fff;border-bottom:1px solid #e6eaf3}.top .shell{padding-top:27px;padding-bottom:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:#6886b7;font-weight:800}.top h1{font-size:29px;letter-spacing:-.5px;color:#203c68;margin:2px 0 4px}.top p{font-size:13px;color:#8191a8;margin:0}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:23px;padding-top:24px}.side{position:sticky;top:20px;align-self:start;background:#fff;border:1px solid #e5eaf3;border-radius:16px;padding:15px;max-height:90vh;overflow:auto}.side-title{font-size:11px;color:#9aaac1;font-weight:800;letter-spacing:1px;margin:5px 10px 12px}.chapter{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#61758f;border-radius:10px;padding:9px 11px;text-align:left;font-size:13px}.chapter.on{background:#eaf1ff;color:#2656ad;font-weight:800}.num{color:#9babc0;font-size:11px;font-variant-numeric:tabular-nums}.chapter.on .num{color:#6c91d5}.main{min-width:0;padding-bottom:45px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:14px}.section-head h2{font-size:25px;margin:0;color:#213d68}.section-head p{font-size:12px;color:#8293aa;margin:3px 0}.stat{color:#5377b4;font-size:12px;font-weight:700}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0 18px}.tabs button{border:1px solid #e2e9f3;background:#fff;color:#627997;border-radius:10px;padding:10px 15px;white-space:nowrap;font-size:13px;font-weight:700}.tabs button.on{background:#2758ad;color:white;border-color:#2758ad}.search{width:100%;border:1px solid #dce5f1;background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:15px}.guide{font-size:12px;color:#7c r;color:#a0adbe;font-size:12px;padding:30px}@media(max-width:760px){.shell{padding:0 12px}.top h1{font-size:23px}.layout{display:block;padding-top:14px}.side{position:static;display:flex;gap:4px;overflow:auto;max-height:none;margin-bottom:15px;padding:8px}.side-title{display:none}.chapter{white-space:nowrap;width:auto;padding:8px}.section-head h2{font-size:22px}.map{padding:14px}.branch{grid-template-columns:1fr;gap:5px}.branch-label{padding:8px 10px}.card{padding:16px}}@media print{.side,.tabs,.search,.btn{display:none!important}.layout{display:block}.card{break-inside:avoid}}`;
document.head.innerHTML='<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教育学 · 背诵与错题中心</title><style>'+css+'</style>';
document.body.innerHTML='<header class="top"><div class="shell"><div class="eyebrow">EDUCATION · RECALL & REVIEW</div><h1>教育学 · 背诵与错题中心</h1><p>重点导图定位知识 · 精细笔记强化记忆 · 历史错题反复纠正</p></div></header><div class="shell layout"><aside class="side" id="side"></aside><main class="main"><div class="section-head"><div><h2 id="chapter-title"></h2><p id="subtitle"></p></div><span class="stat" id="stat"></span></div><div class="tabs" id="tabs"></div><input class="search" id="search" placeholder="搜索人物、名言、题目、易错关键词"><div id="content"></div></main></div><footer class="footer">本机记录掌握状态 · 原始错题与自编练习明确区分</footer>';
function persist(){localStorage.setItem('edu-marks-v7',JSON.stringify(marks))}
function getQs(){return questions.filter(x=>x.chapter===selected&&(x.q+' '+x.a+' '+x.why+' '+x.wrong+' '+x.raw).includes(search)&&(!showWrong||marks[x.id]==='wrong'))}
function noteList(){return(notes[selected]||[]).filter(x=>x.join(' ').includes(search))}
function buttons(id){return '<button class="btn '+(marks[id]==='done'?'good':'')+'" data-mark="'+esc(id)+'" data-state="done">✓ 已掌握</button><button class="btn '+(marks[id]==='wrong'?'bad':'')+'" data-mark="'+esc(id)+'" data-state="wrong">需要重背</button>'}
function questionCard(q,quiz){return '<article class="card"><span class="tag">'+esc(q.origin)+'</span><h3>'+esc(q.q)+'</h3>'+(quiz?'<details><summary>查看答案、解释与易错点</summary>':'')+(q.verified?'<div class="qbox"><strong>正确答案：</strong>'+esc(q.a)+'</div>':'<div class="warn">本题源文件为多栏排版，答案尚未完成可靠拆分，请核对原始解析。</div>')+(q.why?'<div class="hint"><b>理解：</b>'+esc(q.why)+'</div>':'')+(q.wrong?'<div class="warn"><b>易错辨析：</b>'+esc(q.wrong)+'</div>':'')+'<details><summary class="muted">查看原PDF提取文字</summary><div class="raw">'+esc(q.raw)+'</div></details>'+(quiz?'</details>':'')+buttons(q.id)+'</article>'}
function render(){document.getElementById('side').innerHTML='<div class="side-title">章节目录 · 14</div>'+chapters.map(([n,ch])=>'<button class="chapter '+(selected===ch?'on':'')+'" data-chapter="'+esc(ch)+'"><span class="num">'+n+'</span>'+esc(ch)+'</button>').join('');document.getElementById('chapter-title').textContent=selected;const qs=getQs(),ns=noteList();document.getElementById('stat').textContent=ns.length+' 个背诵点 · '+qs.length+' 条原始题目';document.getElementById('subtitle').textContent=selected==='德育'?'德育专题优先精讲：过程、原则、方法、人物':'本章独立资料与错题记录';document.getElementById('tabs').innerHTML=['重点导图','背诵笔记','历史错题','错题自测','资料管理'].map(t=>'<button class="'+(tab===t?'on':'')+'" data-tab="'+t+'">'+t+'</button>').join('');let h='';if(tab==='重点导图'){const gs=[...new Set(ns.map(n=>n[0]))];h='<p class="guide">只放高频重点，全部直接可见。详细解释与题目请到背诵笔记。</p><div class="map"><div class="map-root">'+esc(selected)+' · 必背框架</div>'+gs.map(g=>'<div class="branch"><div class="branch-label">'+esc(g)+'</div><div class="leaves">'+ns.filter(n=>n[0]===g).map(n=>'<span class="leaf">'+esc(n[1])+'</span>').join('')+'</div></div>').join('')+'</div>'}else if(tab==='背诵笔记'){h='<p class="guide">先背结论，再背人物／关键词，最后对照易错辨析；历史错题在下方独立归档。</p>'+ns.map(n=>'<article class="card"><span class="tag">'+esc(n[0])+'</span><h3>'+esc(n[1])+'</h3><div class="body"><b>必须背：</b>'+esc(n[2])+'</div><div class="warn"><b>易错辨析：</b>'+esc(n[3])+'</div><div class="hint"><b>快速记忆：</b>'+esc(n[4])+'</div>'+buttons('note-'+selected+'-'+n[1])+'</article>').join('')+'<h3>本章历史错题 · '+qs.length+'条</h3>'+qs.map(q=>questionCard(q,false)).join('')}else if(tab==='历史错题'){h='<p class="guide">从你此前PDF中提取，按章节分开；答案无法可靠识别的题目保留原文并标注。</p>'+qs.map(q=>questionCard(q,false)).join('')}else if(tab==='错题自测'){h='<p class="guide">先自己作答，再展开答案。错题会保存在本机，方便下次复习。</p><button class="btn" id="filter">'+(showWrong?'显示全部':'只看需要重背')+'</button>'+qs.map(q=>questionCard(q,true)).join('')}else{let items=selected==='课程'?[source[1],source[0]]:selected==='教育制度'||selected==='学生与教师'?[source[2]]:selected==='德育'?[]:[source[0]];h='<p class="guide">保留原始PDF文字资料，不用重建题目覆盖原始记录。</p>'+items.filter(Boolean).map(d=>'<article class="card"><h3>'+esc(d.title)+'</h3><p class="archive-note">'+esc(d.source)+'</p><details><summary>查看原始全文</summary><div class="raw">'+esc(d.text)+'</div></details></article>').join('')+'<button class="btn" id="export">导出学习标记</button><button class="btn" id="import">导入学习标记</button><input type="file" id="upload" accept=".json" hidden>'}document.getElementById('content').innerHTML=h||'<div class="empty">这一章还没有完整整理的背诵笔记，已有原始资料仍可在资料管理中查看。</div>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.chapter){selected=b.dataset.chapter;localStorage.setItem('edu-selected',selected);showWrong=false;search='';document.getElementById('search').value='';render()}else if(b.dataset.tab){tab=b.dataset.tab;showWrong=false;render()}else if(b.dataset.mark){marks[b.dataset.mark]=b.dataset.state;persist();render()}else if(b.id==='filter'){showWrong=!showWrong;render()}else if(b.id==='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(marks)],{type:'application/json'}));a.download='教育学错题复习记录.json';a.click()}else if(b.id==='import'){document.getElementById('upload').click()}});
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;render()});document.addEventListener('change',e=>{if(e.target.id==='upload'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{marks=JSON.parse(r.result);persist();render()}catch(err){alert('导入文件格式错误')}};r.readAsText(e.target.files[0])}});
render();
})();
}catch(e){document.body.innerHTML="<main style=\"padding:30px;font-family:sans-serif\"><h1>页面初始化失败</h1><p>"+String(e.message||e)+"</p></main>";}</script></body></html>
