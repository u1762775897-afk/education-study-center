gin:12px 0 25px}main>.actions button{background:white;border:1px solid var(--line);color:#465c7c;font-size:12px;border-radius:9px;padding:10px 13px;box-shadow:0 2px 6px #21396008}main>.actions button:first-child{background:#315dd0;color:white;border-color:#315dd0}#count{font-weight:700;font-size:14px;color:#3b4e6c;margin:22px 0 13px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px;align-items:stretch}article{margin:0;padding:22px;border-radius:15px;border:1px solid #e6ebf3;box-shadow:0 5px 20px #1d365409;display:flex;flex-direction:column;min-height:160px;position:relative;overflow:hidden}article:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#4776d9,#9bc4ff);opacity:.8}article p{font-size:14px;line-height:1.95;margin:2px 0 18px;flex:1}article small{font-size:12px;line-height:1.8;color:#687c9b}article .actions{margin-top:auto}article button{font-size:12px;background:#f1f5fb;color:#48617f;padding:9px 12px}article button:first-child{background:#ecf3ff;color:#315cc2}footer{font-size:12px;border-top:1px solid var(--line);background:white;padding:22px 12px}.dashboard{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:19px}.stat{background:white;border:1px solid #e5ebf5;border-radius:13px;padding:18px 19px;box-shadow:0 3px 12px #24395608}.stat b{font-size:26px;display:block;color:#263e74;margin-bottom:4px}.stat span{font-size:12px;color:#8290a5}.section-heading{display:flex;align-items:center;justify-content:space-between;margin:25px 0 12px}.section-heading strong{font-size:18px;letter-spacing:-.3px}.section-heading span{font-size:12px;color:#8190a7}.intro{font-size:13px;color:#72839e;margin:0 0 16px;line-height:1.7}@media(max-width:560px){header{padding:26px 20px;min-height:180px}header h1{font-size:26px}main{padding:17px 13px 55px}.stat{padding:13px 12px}.stat b{font-size:21px}.stat span{font-size:11px}article{padding:18px}#cards{grid-template-columns:1fr}nav{padding:10px 12px}}@media print{header{min-height:0}nav,main>.actions,main>input,article button{display:none!important}#cards{display:block}article{break-inside:avoid;margin-bottom:10px}.dashboard{display:none}}.view-switch{display:flex;gap:8px;margin:18px 0}.view-switch button.selected{background:#315dd0;color:white}.tree{background:white;border:1px solid #e1e9f5;border-radius:16px;padding:20px;overflow:auto}.tree-root{background:#264582;color:white;padding:15px 20px;border-radius:12px;font-weight:800;text-align:center;margin:0 auto 20px;max-width:340px}.tree-group{margin:12px 0 12px 18px;border-left:3px solid #cbdaf7;padding-left:17px}.tree-title{background:#eaf1ff;color:#294e9d;width:100%;text-align:left;white-space:normal}.tree-items{padding:8px 0 8px 18px}.tree-leaf{background:#f9fbff;border:1px solid #e2e9f6;border-left:3px solid #7c9cdd;border-radius:10px;padding:12px;margin:8px 0;line-height:1.8;font-size:13px}.tree-leaf summary{cursor:pointer;font-weight:600}.tree-leaf p{white-space:pre-wrap;color:#52647d}.tree[hidden],#cards[hidden]{display:none!important}</style></head><body><header><div class="eyebrow">STUDY SPACE / 2026</div><h1>教育学备考中心</h1><div>章节独立 · 搜索 · 错题复习 · 批注 · 备份</div></header><nav id="nav"></nav><main><input id="search" placeholder="搜索本章知识点与错题"><div class="actions"><button onclick="add()">＋新增错题</button><button onclick="backup()">导出备份</button><button onclick="document.getElementById('upload').click()">导入备份</button><button onclick="print()">打印PDF</button><input id="upload" type="file" accept=".json" hidden onchange="restore(event)"></div><div class="dashboard"><div class="stat"><b id="statTotal">0</b><span>已收录知识点</span></div><div class="stat"><b id="statDone">0</b><span>已掌握</span></div><div class="stat"><b id="statLeft">0</b><span>待复习</span></div></div><div class="section-heading"><strong id="sectionTitle">章节学习</strong><span>CHAPTER NOTES</span></div><p class="intro">点击「编辑/批注」整理你的错题，标记掌握程度会自动保存在本机。</p><div class="view-switch"><button id="treeButton" class="selected" onclick="switchView(true)">思维导图</button><button id="cardsButton" onclick="switchView(false)">错题卡片</button></div><p id="count"></p><div id="tree" class="tree"></div><div id="cards" hidden></div></main><footer>复习数据保存在当前设备浏览器，换设备前请导出备份。</footer><script>
const chapters=["教育制度","学生与教师","课程","德育","教学","教学原则","教学方法","教学评价","教学组织","教育思想","综合复习"];
const seed=[
["教育制度","广义教育制度包括教育考试制度、教育领导体制及各级各类学校制度；教材属于教学内容载体。"],
["教育制度","癸卯学制：1904年正式实施，指导思想中学为体、西学为用；壬戌学制：1922年六三三学制，强调平民教育精神。"],

["课程","要素主义：巴格莱，强调基础知识与基本技能；永恒主义：赫钦斯、阿德勒，强调经典名著与永恒真理。"],
["德育","德育基本途径：思想政治课及其他学科教学。"],

];
let extra=[];try{extra=JSON.parse(localStorage.getItem("edu_extra")||"[]")}catch(e){}let state={};try{state=JSON.parse(localStorage.getItem("edu_state")||"{}")}catch(e){}let tab=0;
function escapeHTML(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function save(){localStorage.setItem("edu_state",JSON.stringify(state));localStorage.setItem("edu_extra",JSON.stringify(extra))}
let treeView=true;function switchView(v){treeView=v;document.getElementById("tree").hidden=!v;document.getElementById("cards").hidden=v;document.getElementById("treeButton").classList.toggle("selected",v);document.getElementById("cardsButton").classList.toggle("selected",!v);render()}function treeRender(entries){let groups={};entries.forEach(x=>{let s=state[x.id]||{};let v=s.text||x.text;let key=v.split(/[：:，,。；;\n]/)[0].trim().slice(0,16)||"知识要点";(groups[key]||(groups[key]=[])).push({x,v,s})});let output='<div class="tree-root">教育学 → '+escapeHTML(chapters[tab])+'</div>';Object.entries(groups).forEach(([name,arr])=>{output+='<details class="tree-group" open><summary class="tree-title" style="padding:12px;border-radius:9px;cursor:pointer">'+escapeHTML(name)+' · '+arr.length+' 个知识点</summary><div class="tree-items">';arr.forEach(o=>{output+='<details class="tree-leaf"><summary>'+escapeHTML(o.v.slice(0,48))+(o.v.length>48?'…':'')+'</summary><p>'+escapeHTML(o.v)+'</p><div class="actions"><button onclick="toggle('+o.x.id+')">'+(o.s.done?'✓ 已掌握':'○ 标记掌握')+'</button><button onclick="edit('+o.x.id+')">编辑批注</button></div></details>'});output+='</div></details>'});return output+'<p style="text-align:center;color:#8190a5;font-size:12px">点击分支和知识点可展开、收起</p>'}function render(){document.getElementById("nav").innerHTML=chapters.map((c,i)=>'<button class="'+(tab===i?"active":"")+'" onclick="tab='+i+';render()">'+c+'</button>').join("");let q=document.getElementById("search").value.toLowerCase();let entries=seed.concat(extra).map((r,i)=>({chapter:r[0],text:r[1],id:i})).filter(x=>x.chapter===chapters[tab]&&((state[x.id]?.text||x.text)+(state[x.id]?.note||"")).toLowerCase().includes(q));document.getElementById("count").textContent=chapters[tab]+" · "+entries.length+" 条";document.getElementById("sectionTitle").textContent=chapters[tab];let all=seed.concat(extra),done=all.filter((r,i)=>state[i]?.done).length;document.getElementById("statTotal").textContent=all.length;document.getElementById("statDone").textContent=done;document.getElementById("statLeft").textContent=all.length-done;document.getElementById("tree").innerHTML=treeRender(entries);document.getElementById("cards").innerHTML=entries.map(x=>{let s=state[x.id]||{};return '<article><p>'+escapeHTML(s.text||x.text)+'</p>'+(s.note?'<small>我的批注：'+escapeHTML(s.note)+'</small><p></p>':'')+'<div class="actions"><button onclick="toggle('+x.id+')">'+(s.done?"✓ 已掌握":"○ 待复习")+'</button><button onclick="edit('+x.id+')">编辑/批注</button></div></article>'}).join("")||'<article>本章尚无记录。可以点击「新增错题」。</article>'}
function toggle(i){state[i]={...state[i],done:!state[i]?.done};save();render()}function edit(i){let x=seed.concat(extra)[i],s=state[i]||{};let t=prompt("编辑题目或知识点",s.text||x[1]);if(t===null)return;let n=prompt("我的批注",s.note||"");if(n===null)return;state[i]={...s,text:t,note:n};save();render()}
function add(){let t=prompt("输入错题或知识点");if(!t)return;extra.push([chapters[tab],t]);save();render()}
function backup(){let b=new Blob([JSON.stringify({extra,state})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="教育学复习备份.json";a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);extra=d.extra||[];state=d.state||{};save();render()}catch(e){alert("备份文件格式错误")}};r.readAsText(f)}
document.getElementById("search").oninput=render;let start=0;document.addEventListener("touchstart",e=>{start=e.changedTouches[0].clientX},{passive:true});document.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>140){tab=Math.max(0,Math.min(chapters.length-1,tab+(dx<0?1:-1)));render()}},{passive:true});render();
