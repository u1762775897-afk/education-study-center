<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师招聘·教育学备考中心</title><style>*{box-sizing:border-box}body{font:16px -apple-system,"PingFang SC",sans-serif;background:#f4f6fb;color:#25334a;margin:0}header{background:#28477f;color:white;padding:24px 18px}h1{font-size:22px;margin:0 0 8px}nav{display:flex;overflow-x:auto;position:sticky;top:0;background:white;padding:12px;gap:8px}button{border:0;border-radius:10px;background:#e7edf8;padding:11px;color:#25447c;font-weight:600;white-space:nowrap}button.active,.primary{background:#315eb6;color:white}main{max-width:850px;margin:auto;padding:16px}input,textarea{width:100%;font:inherit;padding:12px;border:1px solid #d8deeb;border-radius:10px;margin:8px 0}article{background:white;border:1px solid #e3e9f4;border-radius:13px;padding:16px;margin:12px 0;line-height:1.7}article p{white-space:pre-wrap}small{color:#67758b}.actions{display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;padding:22px;color:#68758b}</style></head><body><header><h1>教师招聘 · 教育学备考中心</h1><div>章节独立 · 搜索 · 错题复习 · 批注 · 备份</div></header><nav id="nav"></nav><main><input id="search" placeholder="搜索本章知识点与错题"><div class="actions"><button onclick="add()">＋新增错题</button><button onclick="backup()">导出备份</button><button onclick="document.getElementById('upload').click()">导入备份</button><button onclick="print()">打印PDF</button><input id="upload" type="file" accept=".json" hidden onchange="restore(event)"></div><p id="count"></p><div id="cards"></div></main><footer>复习数据保存在当前设备浏览器，换设备前请导出备份。</footer><script>
const chapters=["教育制度","学生与教师","课程","德育","教学","教学原则","教学方法","教学评价","教学组织","教育思想","综合复习"];
const seed=[
["教育制度","广义教育制度包括教育考试制度、教育领导体制及各级各类学校制度；教材属于教学内容载体。"],
["教育制度","癸卯学制：1904年正式实施，指导思想中学为体、西学为用；壬戌学制：1922年六三三学制，强调平民教育精神。"],
["学生与教师","学生具有主观能动性，主要表现为自觉性、独立性与创造性。"],
["课程","小学阶段课程应体现普及性、基础性、发展性。"],
["课程","要素主义：巴格莱，强调基础知识与基本技能；永恒主义：赫钦斯、阿德勒，强调经典名著与永恒真理。"],
["德育","德育基本途径：思想政治课及其他学科教学。"],
["德育","德育过程基本矛盾：教育者提出的德育要求与受教育者现有品德水平之间的矛盾。"],
["德育","德育过程强调组织学生的活动和交往，统一多方面教育影响。"],
["德育","品德形成的外在客观标志：道德行为。"],
["德育","明知故犯、雷声大雨点小：知行脱节，应强调知行统一。"],
["德育","创设良好环境、潜移默化影响学生：陶冶教育法。"],
["德育","马卡连柯：尊重学生与严格要求相结合；平行教育影响。"],
["德育","道德两难讨论：科尔伯格的道德认知发展理论。"],
["德育","孔子：君子耻其言而过其行，强调知行统一。"],
["德育","言传不如身教：榜样示范；循循善诱：说服教育。"],
["德育","德育性质具有社会性、历史性、继承性。"],
["德育","原记录中德育原则多选题答案为A、B、D、E，原题选项待核。"],
["德育","罗森塔尔相关题目：原题与答案待核。"],
["教学原则","因材施教：针对学生个别差异采取不同教育方法。"],
["教学评价","评价应结合诊断、反馈与促进发展等功能。"]
];
let extra=[];try{extra=JSON.parse(localStorage.getItem("edu_extra")||"[]")}catch(e){}let state={};try{state=JSON.parse(localStorage.getItem("edu_state")||"{}")}catch(e){}let tab=0;
function escapeHTML(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function save(){localStorage.setItem("edu_state",JSON.stringify(state));localStorage.setItem("edu_extra",JSON.stringify(extra))}
function render(){document.getElementById("nav").innerHTML=chapters.map((c,i)=>'<button class="'+(tab===i?"active":"")+'" onclick="tab='+i+';render()">'+c+'</button>').join("");let q=document.getElementById("search").value.toLowerCase();let entries=seed.concat(extra).map((r,i)=>({chapter:r[0],text:r[1],id:i})).filter(x=>x.chapter===chapters[tab]&&((state[x.id]?.text||x.text)+(state[x.id]?.note||"")).toLowerCase().includes(q));document.getElementById("count").textContent=chapters[tab]+" · "+entries.length+" 条";document.getElementById("cards").innerHTML=entries.map(x=>{let s=state[x.id]||{};return '<article><p>'+escapeHTML(s.text||x.text)+'</p>'+(s.note?'<small>我的批注：'+escapeHTML(s.note)+'</small><p></p>':'')+'<div class="actions"><button onclick="toggle('+x.id+')">'+(s.done?"✓ 已掌握":"○ 待复习")+'</button><button onclick="edit('+x.id+')">编辑/批注</button></div></article>'}).join("")||'<article>本章尚无记录。可以点击「新增错题」。</article>'}
function toggle(i){state[i]={...state[i],done:!state[i]?.done};save();render()}function edit(i){let x=seed.concat(extra)[i],s=state[i]||{};let t=prompt("编辑题目或知识点",s.text||x[1]);if(t===null)return;let n=prompt("我的批注",s.note||"");if(n===null)return;state[i]={...s,text:t,note:n};save();render()}
function add(){let t=prompt("输入错题或知识点");if(!t)return;extra.push([chapters[tab],t]);save();render()}
function backup(){let b=new Blob([JSON.stringify({extra,state})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="教育学复习备份.json";a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);extra=d.extra||[];state=d.state||{};save();render()}catch(e){alert("备份文件格式错误")}};r.readAsText(f)}
document.getElementById("search").oninput=render;let start=0;document.addEventListener("touchstart",e=>{start=e.changedTouches[0].clientX},{passive:true});document.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>140){tab=Math.max(0,Math.min(chapters.length-1,tab+(dx<0?1:-1)));render()}},{passive:true});render();
</script></body></html>
